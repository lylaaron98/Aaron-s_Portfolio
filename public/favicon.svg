<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Aaron Lee">
  <!-- Same construction and geometry as src/components/ui/Logo (variant
       "solid"): the A reversed out of a gradient tile in the page colour.
       Colours are literal here because a favicon renders outside the document
       and cannot read tokens — these are the dark-theme values of --brand-2 /
       --brand / --brand-3 and --bg. -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b5bf0"/>
      <stop offset="55%" stop-color="#19c3b2"/>
      <stop offset="100%" stop-color="#e0489c"/>
    </linearGradient>
  </defs>
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="9.2" fill="url(#sweep)"/>
  <path d="M8.2 24.4 L16 7.6 L23.8 24.4" fill="none" stroke="#070912"
        stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M12 19.2 H20" fill="none" stroke="#070912"
        stroke-width="2.6" stroke-linecap="round"/>
</svg>
